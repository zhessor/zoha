<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="How Zoha works: microphone, wake word, hearing, brain, tools, voice" xmlns:c2pa="http://c2pa.org/manifest">
<title>How Zoha works: microphone, wake word, hearing, brain, tools, voice</title>
<defs>
<radialGradient id="core" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#6EF5EE"/><stop offset="1" stop-color="#5CD3C3"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5CD3C3" stop-opacity=".35"/><stop offset="1" stop-color="#5CD3C3" stop-opacity="0"/></radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1A17"/><stop offset="1" stop-color="#0B1210"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5CD3C3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#E58B7B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="540" rx="20" fill="url(#bg)"/>
<text x="60" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E6F2EF" text-anchor="start">How Zoha works</text>
<text x="60" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9FB8B2" text-anchor="start">Say her name, and she listens, thinks, acts and answers.</text>
<rect x="75" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="150.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Microphone</text>
<text x="150.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">You say</text>
<text x="150.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">“Zoha, open Spotify”</text>
<line x1="229" y1="170.0" x2="251" y2="170.0" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="255" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="330.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Wake word</text>
<text x="330.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Spots her name,</text>
<text x="330.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">even if misheard</text>
<line x1="409" y1="170.0" x2="431" y2="170.0" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="435" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="510.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Hearing</text>
<text x="510.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Whisper, runs</text>
<text x="510.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">on your PC</text>
<line x1="589" y1="170.0" x2="611" y2="170.0" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="615" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#5CD3C3" stroke-width="1.6"/>
<text x="690.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Brain</text>
<text x="690.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Picks the tools,</text>
<text x="690.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">writes the answer</text>
<line x1="769" y1="170.0" x2="791" y2="170.0" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="795" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#5CD3C3" stroke-width="1.6"/>
<text x="870.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Tools</text>
<text x="870.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Does the task,</text>
<text x="870.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">asks before risky</text>
<line x1="949" y1="170.0" x2="971" y2="170.0" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="975" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="1050.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Voice</text>
<text x="1050.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Kokoro speaks</text>
<text x="1050.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">back, offline</text>
<line x1="690.0" y1="220" x2="690.0" y2="262" stroke="#5CD3C3" stroke-opacity=".5" stroke-dasharray="4 4"/>
<text x="690.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5E716C" text-anchor="middle">pick any</text>
<rect x="609" y="276" width="162" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="690.0" y="297" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">Gemini</text>
<rect x="609" y="318" width="162" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="690.0" y="339" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">OpenAI-compatible</text>
<rect x="609" y="360" width="162" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="690.0" y="381" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">Ollama (local)</text>
<line x1="870.0" y1="220" x2="870.0" y2="262" stroke="#5CD3C3" stroke-opacity=".5" stroke-dasharray="4 4"/>
<text x="870.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5E716C" text-anchor="middle">built in</text>
<rect x="789" y="276" width="162" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="870.0" y="297" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">Apps and PC</text>
<rect x="789" y="318" width="162" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="870.0" y="339" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">Files</text>
<rect x="789" y="360" width="162" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="870.0" y="381" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">Her own browser</text>
<rect x="789" y="402" width="162" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="870.0" y="423" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">Web pages</text>
<rect x="789" y="444" width="162" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="870.0" y="465" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">Your plugins</text>
<text x="60" y="512" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5E716C" text-anchor="start">Wake word, hearing and voice run on your machine. Only the brain can be a cloud model, and that is your choice.</text>

