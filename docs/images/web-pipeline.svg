<marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#E58B7B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="400" rx="20" fill="url(#bg)"/>
<text x="60" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E6F2EF" text-anchor="start">From “make me a website” to a checked page</text>
<text x="60" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9FB8B2" text-anchor="start">Every page is written, tested in a real headless browser and repaired before you see it.</text>
