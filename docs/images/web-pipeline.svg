<text x="150.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Your ask</text>
<text x="150.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">“A gym in</text>
<text x="150.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Andheri East”</text>
<line x1="229" y1="170" x2="251" y2="170" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="255" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="330.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Design kit</text>
<text x="330.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Layout, palette,</text>
<text x="330.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">fonts, motion</text>
<line x1="409" y1="170" x2="431" y2="170" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="435" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="510.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">3 drafts</text>
<text x="510.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Written at different</text>
<text x="510.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">temperatures</text>
<line x1="589" y1="170" x2="611" y2="170" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="615" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="690.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Lint + fix</text>
<text x="690.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">20+ checks: SEO,</text>
<text x="690.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">contrast, links</text>
<line x1="769" y1="170" x2="791" y2="170" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="795" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#5CD3C3" stroke-width="1.6"/>
<text x="870.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Browser test</text>
<text x="870.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Phone and desktop,</text>
<text x="870.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">menu, overflow</text>
<line x1="949" y1="170" x2="971" y2="170" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="975" y="120" width="150" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="1050.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Polish</text>
<text x="1050.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Motion, optional</text>
<text x="1050.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">3D, your photos</text>
<path d="M 870.0 232 C 870.0 268, 690.0 268, 690.0 234" fill="none" stroke="#E58B7B" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrc)"/>
<text x="780.0" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E58B7B" text-anchor="middle">problems found? fix and test again</text>
<rect x="75" y="330" width="250" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="200.0" y="351" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">114,000 layout combinations</text>
<rect x="339" y="330" width="160" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="419.0" y="351" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">17 MIT templates</text>
<rect x="513" y="330" width="175" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="600.5" y="351" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">three.js 3D scenes</text>
<rect x="702" y="330" width="290" height="32" rx="16" fill="#111C19" stroke="#24332F"/>
<text x="847.0" y="351" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#9FB8B2" text-anchor="middle">“Improve it” upgrades the last page</text>

