<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Zoha asks for a clear yes before risky actions" xmlns:c2pa="http://c2pa.org/manifest">
<title>Zoha asks for a clear yes before risky actions</title>
<defs>
<radialGradient id="core" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#6EF5EE"/><stop offset="1" stop-color="#5CD3C3"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5CD3C3" stop-opacity=".35"/><stop offset="1" stop-color="#5CD3C3" stop-opacity="0"/></radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1A17"/><stop offset="1" stop-color="#0B1210"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5CD3C3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#E58B7B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="330" rx="20" fill="url(#bg)"/>
<text x="60" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E6F2EF" text-anchor="start">She asks before anything risky</text>
<text x="60" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9FB8B2" text-anchor="start">Sending, changing a live site, shutting down: nothing happens without your clear yes.</text>
<rect x="50" y="120" width="230" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="165.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Zoha proposes</text>
<text x="165.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Creates the change.</text>
<text x="165.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Nothing happens yet.</text>
<line x1="284" y1="170" x2="336" y2="170" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="340" y="120" width="230" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="455.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Reads it aloud</text>
<text x="455.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">“Change the price to</text>
<text x="455.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">₹999. Go ahead?”</text>
<line x1="574" y1="170" x2="626" y2="170" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="630" y="120" width="230" height="100" rx="14" fill="#111C19" stroke="#5CD3C3" stroke-width="1.6"/>
<text x="745.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">You say yes</text>
<text x="745.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Only your very next</text>
<text x="745.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">words count.</text>
<line x1="864" y1="170" x2="916" y2="170" stroke="#5CD3C3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="920" y="120" width="230" height="100" rx="14" fill="#111C19" stroke="#24332F" stroke-width="1"/>
<text x="1035.0" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6F2EF" text-anchor="middle">Done, once</text>
<text x="1035.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">Applied one time,</text>
<text x="1035.0" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9FB8B2" text-anchor="middle">within 5 minutes.</text>
<line x1="745.0" y1="220" x2="745.0" y2="270" stroke="#E58B7B" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrc)"/>
<rect x="555.0" y="274" width="380" height="32" rx="16" fill="#111C19" stroke="#E58B7B"/>
<text x="745.0" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E58B7B" text-anchor="middle">Anything else (no, silence, a new request) cancels it</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
